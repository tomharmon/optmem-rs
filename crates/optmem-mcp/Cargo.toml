[package]
name = "optmem-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OptMem MCP server over stdio with pluggable storage"

[dependencies]
optmem = { path = "../..", version = "0.1.0" }
optmem-agent = { path = "../optmem-agent", version = "0.1.0" }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time"] }
